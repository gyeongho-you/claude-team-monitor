[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# claude agents --json 실행에 타임아웃을 걸기 위함 — std::process::Child::wait에는 타임아웃이 없다.
wait-timeout = "0.2"
# stallGuard.js의 APPROVAL_PATTERN(승인/확인 요청 정규식)과 Haiku 응답의 ```json 코드펜스 추출을
# main.ts와 정확히 같은 방식으로 옮기기 위함 — 손으로 문자열 매칭을 흉내내면 놓치는 패턴이 생기기
# 쉬운, 안전장치(정체 감시가 실수로 재촉하면 안 되는 상황) 관련 로직이라 검증된 크레이트를 쓴다.
regex = "1"
# leadOperationQueues/queueLeadOperation·buildSessionRowsChain(concurrency.rs)의 동시성
# primitive용 — tauri 2가 내부적으로 이미 tokio 런타임 위에서 도므로 버전 충돌 없이 얹힌다.
# "macros"는 #[tokio::test], "time"은 concurrency.rs 테스트의 sleep 기반 경합 검증에 쓴다.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
