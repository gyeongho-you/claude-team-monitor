[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# claude agents --json 실행에 타임아웃을 걸기 위함 — std::process::Child::wait에는 타임아웃이 없다.
wait-timeout = "0.2"
# stallGuard.js의 APPROVAL_PATTERN(승인/확인 요청 정규식)과 Haiku 응답의 ```json 코드펜스 추출을
# main.ts와 정확히 같은 방식으로 옮기기 위함 — 손으로 문자열 매칭을 흉내내면 놓치는 패턴이 생기기
# 쉬운, 안전장치(정체 감시가 실수로 재촉하면 안 되는 상황) 관련 로직이라 검증된 크레이트를 쓴다.
regex = "1"
# leadOperationQueues/queueLeadOperation·buildSessionRowsChain(concurrency.rs)의 동시성
# primitive용 — tauri 2가 내부적으로 이미 tokio 런타임 위에서 도므로 버전 충돌 없이 얹힌다.
# "macros"는 #[tokio::test], "time"은 concurrency.rs 테스트의 sleep 기반 경합 검증에 쓴다.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
# issueMcpToken/resolveLongPrompt(main.ts)의 crypto.randomUUID() 대응 — 이미 tauri 자체의
# transitive dependency라 버전을 새로 끌어오는 건 아니고, 직접 dependency로 승격만 한다.
uuid = { version = "1", features = ["v4"] }
# logCritical(main.ts)이 app.log에 남기는 new Date().toISOString() 타임스탬프 대응 — tauri-plugin-log가
# 이미 chrono를 transitive dependency로 끌어와 있어(Cargo.lock 확인) 새 버전을 추가하는 게 아니라
# 직접 dependency로 승격만 한다.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
# resume.rs의 재시도/백그라운드 치유 상태 기계 테스트가 RESUME_SETTLE_CHECK_MS(13s)/
# RESUME_RETRY_GAP_MS(5s) 같은 실제 타이밍 상수를 그대로 쓰면서도(값 자체를 줄여치기하면 그 값이
# 실제로 맞는지 검증하는 의미가 없어진다) 테스트가 수십 초씩 걸리지 않게, start_paused=true로
# tokio의 가상 시계를 쓴다 — 실행할 태스크가 없으면 다음 타이머까지 시간이 즉시 앞당겨진다.
tokio = { version = "1", features = ["test-util"] }
