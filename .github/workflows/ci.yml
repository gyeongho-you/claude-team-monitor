name: CI

# 푸시와 PR마다 시험을 돌린다. 이 앱은 Windows에서 개발·검증했으므로 Windows가 기준(test, installer)이다.
# Linux는 같은 시험을 필수로 돌린다(Debian 컨테이너에서 전체 통과를 확인했다). macOS는 아직 한 번도 돌려 보지 못해서
# "참고용"(continue-on-error)으로만 돌린다 — 실패해도 CI 전체는 실패로 만들지 않고, 결과는 Actions 화면에서 볼 수 있다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: JS 시험
        run: npm test

      # 앱에 실제로 들어가는(운영) 의존성에 알려진 취약점이 있으면 실패한다. 개발 도구(devDependencies)는 빌드 환경에만 쓰이므로 제외한다.
      - name: 운영 의존성 취약점 검사
        run: npm audit --omit=dev --audit-level=low

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 스크립트 슬롯 시험이 node·python·PowerShell을 실제로 실행한다(windows-latest에 모두 있다).
      # 진짜 claude CLI를 부르는 시험은 #[ignore]라 여기서 돌지 않는다.
      - name: Rust 시험
        working-directory: src-tauri
        run: cargo test --lib

  installer:
    # 설치 파일(NSIS)이 만들어지고, 앱이 실행 중에 읽는 파일(resources/)이 들어 있는지 확인한다.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 설치 파일 빌드
        run: npm run tauri:build:release

      - name: 설치 파일 목록 확인
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          test -n "$(ls src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null)"

      # 릴리스 워크플로가 쓰는 "배포 파일 모으기"(압축본 구성·필수 파일 확인·체크섬)를 매 푸시마다 실행해, 태그를 올리기 전에도 이 단계를 시험한다.
      - name: 배포 파일 모으기 점검(릴리스와 같은 스크립트)
        shell: pwsh
        run: ./scripts/collect-release-files.ps1 -Version "ci-${{ github.sha }}"

      # 방금 빌드한 실제 앱을 띄워 화면을 점검한다(tests/e2e/smoke.js — 탭·접근성·도움말·스크립트 슬롯 관문·격리 프레임·진단·단일 실행 보호).
      # 참고용: 로컬에서는 12/12 통과했지만 CI 러너(WebView2 환경)에서는 이번이 처음이라, 결과가 안정적임을 확인할 때까지 실패해도 CI 전체를 막지 않는다.
      - name: 화면 E2E 시험
        continue-on-error: true
        shell: bash
        env:
          CTM_EXE: src-tauri/target/release/Claude Team Monitor.exe
          CTM_E2E_SINGLE_INSTANCE: "1"
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  test-linux:
    # 화면 없이 도는 자동 시험(Rust 전체 + JS)만 본다. 실제 화면은 Windows에서만 확인했다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Tauri 빌드 의존 패키지(Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 시험
        working-directory: src-tauri
        run: cargo test --lib

  test-macos:
    # 참고용: macOS는 아직 한 번도 검증하지 못했다. 실패해도 CI 전체를 막지 않는다.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 시험
        working-directory: src-tauri
        run: cargo test --lib

  audit-rust:
    # 참고용: Rust 의존성(RustSec 데이터베이스)에 알려진 취약점이 있는지 본다. Tauri의 간접 의존성에서 "더 이상 관리되지 않음" 경고가 자주 나와서 막지는 않는다.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-audit 설치
        run: cargo install cargo-audit --locked

      - name: Rust 의존성 취약점 검사
        working-directory: src-tauri
        run: cargo audit
