name: CI

# 푸시와 PR마다 시험을 돌린다. 이 앱은 Windows에서 개발·검증했으므로 Windows가 기준(test, installer)이다.
# Linux는 같은 시험을 필수로 돌린다(Debian 컨테이너에서 전체 통과를 확인했다). macOS는 아직 한 번도 돌려 보지 못해서
# "참고용"(continue-on-error)으로만 돌린다 — 실패해도 CI 전체는 실패로 만들지 않고, 결과는 Actions 화면에서 볼 수 있다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: JS 시험
        run: npm test

      # 앱에 실제로 들어가는(운영) 의존성에 알려진 취약점이 있으면 실패한다. 개발 도구(devDependencies)는 빌드 환경에만 쓰이므로 제외한다.
      - name: 운영 의존성 취약점 검사
        run: npm audit --omit=dev --audit-level=low

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 스크립트 슬롯 시험이 node·python·PowerShell을 실제로 실행한다(windows-latest에 모두 있다).
      # 진짜 claude CLI를 부르는 시험은 #[ignore]라 여기서 돌지 않는다.
      - name: Rust 시험
        working-directory: src-tauri
        run: cargo test --lib

  installer:
    # 설치 파일(NSIS)이 만들어지고, 앱이 실행 중에 읽는 파일(resources/)이 들어 있는지 확인한다.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 설치 파일 빌드
        shell: bash
        run: |
          set +e
          npm run tauri:build:release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 로그는 인증 없이 못 읽으므로 실패 원인(오류 줄과 끝부분)을 주석으로 남긴다.
            msg=$( (grep -n -i -E "^error|error\[|error:|failed|panicked" build.log | head -8; echo ---; tail -n 14 build.log) | cut -c1-300 | tr -d '' | paste -sd '|' - | sed 's/%/%25/g' )
            echo "::error title=installer-build::$msg"
          fi
          exit $code

      - name: 설치 파일 목록 확인
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          test -n "$(ls src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null)"

      # 릴리스 워크플로가 쓰는 "배포 파일 모으기"(압축본 구성·필수 파일 확인·체크섬)를 매 푸시마다 실행해, 태그를 올리기 전에도 이 단계를 시험한다.
      - name: 배포 파일 모으기 점검(릴리스와 같은 스크립트)
        shell: pwsh
        run: ./scripts/collect-release-files.ps1 -Version "ci-${{ github.sha }}"

      # 화면 E2E(npm run test:e2e)는 CI에서 돌리지 않는다: 데스크톱 화면이 없는 GitHub 러너에서는 앱 프로세스는 뜨지만 WebView2 창이 초기화되지 않아
      # 원격 디버그 포트가 열리지 않는다(러너에 WebView2 런타임 156은 있었음 — 실제로 시도해 확인). 로컬 Windows에서 12개 모두 통과한다 — README "시험" 참고.

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  test-linux:
    # 화면 없이 도는 자동 시험(Rust 전체 + JS)만 본다. 실제 화면은 Windows에서만 확인했다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Tauri 빌드 의존 패키지(Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 시험
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo test --lib --no-fail-fast 2>&1 | tee ../rust-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 실패한 시험 이름과 단언 메시지를 워크플로 주석으로 남긴다(로그를 내려받지 않아도 Actions 화면과 공개 API에서 바로 보인다)
            summary="$(grep -E '^test .* FAILED$|panicked at|^  left:|^ right:|^error' ../rust-test.log | head -40)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Rust 시험 실패::${summary}"
          fi
          exit $code

  test-macos:
    # 참고용: macOS는 아직 한 번도 검증하지 못했다. 실패해도 CI 전체를 막지 않는다.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 시험
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo test --lib --no-fail-fast 2>&1 | tee ../rust-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 실패한 시험 이름과 단언 메시지를 워크플로 주석으로 남긴다(로그를 내려받지 않아도 Actions 화면과 공개 API에서 바로 보인다)
            summary="$(grep -E '^test .* FAILED$|panicked at|^  left:|^ right:|^error' ../rust-test.log | head -40)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Rust 시험 실패::${summary}"
          fi
          exit $code

  audit-rust:
    # 참고용: Rust 의존성(RustSec 데이터베이스)에 알려진 취약점이 있는지 본다. Tauri의 간접 의존성에서 "더 이상 관리되지 않음" 경고가 자주 나와서 막지는 않는다.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-audit 설치
        run: cargo install cargo-audit --locked

      - name: Rust 의존성 취약점 검사
        working-directory: src-tauri
        run: cargo audit
