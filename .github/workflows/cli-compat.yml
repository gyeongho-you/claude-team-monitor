name: CLI compat

# 이 앱은 claude CLI의 공개 보장이 없는 동작(--bg, agents --json, attach 등)에 의존한다. 일주일에 한 번 최신 claude CLI를 설치해서,
# 앱이 쓰는 플래그·하위 명령이 아직 `claude --help`에 있는지 확인한다(로그인 없이 가능). 실패하면 CLI가 바뀐 것이니 앱을 맞춰야 한다.
# 손으로 돌릴 수도 있다(Actions → CLI compat → Run workflow).
# 이 파일을 고쳐 푸시해도 실행된다(고치자마자 실제로 도는지 확인할 수 있게). 같은 시험(real_claude_cli_exposes_the_features_the_app_uses)은 로컬에서 claude 2.1.319로 통과했다.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cli-compat.yml"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 최신 claude CLI 설치
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Tauri 빌드 의존 패키지(Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 앱이 쓰는 기능이 최신 CLI에 아직 있는지 확인
        working-directory: src-tauri
        run: cargo test --lib real_claude_cli -- --ignored --nocapture
